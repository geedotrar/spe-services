services:
  postgres:
    image: postgres:16-alpine
    container_name: spe-postgres
    environment:
      POSTGRES_DB: spe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spe"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: spe-redis
    ports:
      - "6379:6379"

  auth-service:
    build:
      context: ./auth-services
    container_name: spe-auth-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./auth-services/.env
    volumes:
      - ./auth-services/.env:/app/.env:ro
    ports:
      - "9090:9090"

volumes:
  postgres_data:
